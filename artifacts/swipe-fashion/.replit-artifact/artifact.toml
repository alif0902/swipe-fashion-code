kind = "web"
previewPath = "/"
title = "SwipeFash - Fashion Swipe Store"
version = "1.0.0"
id = "artifacts/swipe-fashion"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20099

[services.development]
run = "pnpm --filter @workspace/swipe-fashion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/swipe-fashion", "run", "build" ]
serve = "static"
publicDir = "artifacts/swipe-fashion/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20099"
BASE_PATH = "/"
